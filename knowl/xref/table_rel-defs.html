<tr>
<td class="l m b1 r0 l0 t0 lines"></td>

<td class="l m b1 r0 l0 t0 lines"></td>

<tr>
<td class="l m b0 r0 l0 t0 lines"><em class="emphasis">Definition of momentum:</em></td>
<td class="l m b0 r0 l0 t0 lines"><div class="displaymath process-math">
\begin{equation*}
\vec p =\frac{m\vec u}{\sqrt{1-u^2/c^2}}
\end{equation*}
</div></td>
<td class="l m b0 r0 l0 t0 lines"><em class="emphasis">Definition of energy:</em></td>
<td class="l m b0 r0 l0 t0 lines"><div class="displaymath process-math">
\begin{equation*}
E =\frac{mc^2}{\sqrt{1-u^2/c^2}}
\end{equation*}
</div></td>
</tr>
<tr>
<td class="l m b0 r0 l0 t0 lines"><em class="emphasis">Energy in terms of momentum and mass:</em></td>
<td class="l m b0 r0 l0 t0 lines"><div class="displaymath process-math">
\begin{equation*}
E^2 = p^2c^2 + m^2c^4
\end{equation*}
</div></td>
<td class="l m b0 r0 l0 t0 lines"><em class="emphasis">Velocity in terms of energy and momentum:</em></td>
</tr>
<tr>
<td class="l m b0 r0 l0 t0 lines">(See Problem \arabic{chapter}. <a href="chap_relativity_pande-11.html#prob_rel-u-p-e" class="xref" data-knowl="./knowl/xref/prob_rel-u-p-e.html" data-reveal-label="Reveal" data-close-label="Close" title="Checkpoint 5.10.6">Checkpoint 5.10.6</a>.)</td>
<td class="l m b0 r0 l0 t0 lines"><div class="displaymath process-math">
\begin{equation*}
\vec{u} = \frac{\vec{p}c^2}{E}
\end{equation*}
</div></td>
</tr>
<tr>
<td class="l m b0 r0 l0 t0 lines"></td>
<td class="l m b0 r0 l0 t0 lines"></td>
<td class="l m b0 r0 l0 t0 lines"></td>
<td class="l m b0 r0 l0 t0 lines"></td>
</tr>
<tr>
<td class="l m b0 r0 l0 t0 lines"><em class="emphasis">Definition of kinetic energy:</em></td>
<td class="l m b0 r0 l0 t0 lines"><div class="displaymath process-math">
\begin{equation*}
K = E - mc^2
\end{equation*}
</div></td>
<td class="l m b0 r0 l0 t0 lines"><em class="emphasis">Energy in terms of momentum for zero-mass particle:</em></td>
<td class="l m b0 r0 l0 t0 lines"><div class="displaymath process-math">
\begin{equation*}
E = \left|\vec{p}\right|c
\end{equation*}
</div></td>
</tr>
